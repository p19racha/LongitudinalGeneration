services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pulse_cdss_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PULSE_DB_PATH=/app/data/pulse_cdss.db
      - AUTO_SEED_DEMO_DATA=True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pulse_cdss_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
